name: Feature request
description: Propose an improvement tied to a concrete user or business problem.
title: "[Feature]: "
body:
  - type: checkboxes
    id: existing-request
    attributes:
      label: Existing request
      description: Search open and closed issues before submitting a duplicate.
      options:
        - label: I searched for an existing request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem should we solve?
      description: Explain who has the problem, what they are trying to do, and why the current behavior is insufficient.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Share a possible solution if you have one. This is optional.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that would demonstrate the request is complete.
      placeholder: |
        - [ ] Given..., when..., then...
        - [ ] Existing behavior remains unchanged for...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Include workarounds, rejected alternatives, examples, screenshots, or related links.
